<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Asta Fantacalcio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
        }
        .container {
            width: 100%;
            max-width: 420px;
            height: 100%;
            background: white;
            padding: 12px 14px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        h1 {
            font-size: 24px;
            color: #2c3e50;
            font-weight: 800;
            margin-bottom: 2px;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            color: #444;
            margin-bottom: 6px;
            background: #eef2f7;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 600;
        }
        .credits-badge {
            font-weight: 800;
            color: #27ae60;
            font-size: 20px;
        }
        .call-panel {
            display: flex;
            gap: 6px;
        }
        .call-panel input {
            flex: 1;
            padding: 10px 12px;
            font-size: 18px;
            border-radius: 8px;
            border: 1px solid #ccc;
            outline: none;
        }
        .player-title {
            font-size: 32px;
            font-weight: 900;
            color: #1a252f;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.1;
        }
        .timer {
            font-size: 85px;
            font-weight: 900;
            color: #e74c3c;
            line-height: 0.9;
            margin: 2px 0;
        }
        .info-box {
            font-size: 20px;
            color: #222;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #eee;
            font-weight: 600;
        }
        button {
            padding: 10px 14px;
            font-size: 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            color: white;
            transition: opacity 0.15s;
        }
        button:active { opacity: 0.8; }
        button:disabled {
            background-color: #bdc3c7 !important;
            cursor: not-allowed;
            opacity: 0.6;
        }
        .btn-green { background-color: #2ecc71; }
        .btn-blue { background-color: #3498db; }
        .btn-red { background-color: #e74c3c; }

        .bid-buttons {
            display: flex;
            gap: 8px;
            margin-bottom: 2px;
        }
        .bid-btn {
            flex: 1;
            font-size: 28px;
            font-weight: 900;
            padding: 18px 0;
            border-radius: 10px;
            background-color: #2ecc71;
            box-shadow: 0 4px 0 #27ae60;
        }
        .bid-btn:active {
            box-shadow: none;
            transform: translateY(2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div>
            <h1>Asta Fantacalcio</h1>
            <div id="loginSection" style="margin-top: 40px;">
                <p style="margin-bottom: 12px; font-size: 18px; font-weight: 600;">Inserisci il tuo nome per entrare:</p>
                <input type="text" id="userNameInput" placeholder="Il tuo nome" style="padding: 14px; font-size: 18px; width: 100%; margin-bottom: 12px; border-radius: 8px; border: 1px solid #ccc;">
                <button class="btn-green" onclick="login()" style="width: 100%; font-size: 20px; padding: 14px;">Entra</button>
            </div>
        </div>

        <div id="auctionSection" style="display: none; height: 100%; flex-direction: column; justify-content: space-between;">
            <div>
                <div class="header-bar">
                    <span>Utente: <b id="displayName"></b></span>
                    <span>Crediti: <span class="credits-badge" id="myCredits">500</span></span>
                </div>
                <div class="call-panel">
                    <input type="text" id="playerInput" placeholder="Nome Giocatore">
                    <button class="btn-blue" onclick="callPlayer()" style="font-size: 18px;">Chiama</button>
                    <button class="btn-red" onclick="resetAuction()" style="font-size: 18px;">X</button>
                </div>
            </div>

            <div class="player-title" id="currentPlayer">In attesa...</div>

            <div class="timer" id="timer">5</div>

            <div class="info-box">
                Offerta: <b id="currentBid" style="font-size: 30px; color: #2c3e50;">0</b> cr<br>
                Offerente: <b id="highestBidder" style="color: #27ae60;">-</b>
            </div>

            <div class="bid-buttons">
                <button class="bid-btn" onclick="placeIncrementBid(1)" id="bidBtn1" disabled>+1</button>
                <button class="bid-btn" onclick="placeIncrementBid(5)" id="bidBtn5" disabled>+5</button>
                <button class="bid-btn" onclick="placeIncrementBid(10)" id="bidBtn10" disabled>+10</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myName = "";

        function login() {
            const name = document.getElementById('userNameInput').value.trim();
            if (name) {
                myName = name;
                document.getElementById('displayName').innerText = myName;
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('auctionSection').style.display = 'flex';
                socket.emit('registerUser', myName);
            }
        }

        function callPlayer() {
            const player = document.getElementById('playerInput').value.trim();
            if (player) {
                socket.emit('callPlayer', player);
                document.getElementById('playerInput').value = "";
            }
        }

        function placeIncrementBid(increment) {
            socket.emit('placeIncrementBid', { userName: myName, increment: increment });
        }

        function resetAuction() {
            socket.emit('resetAuction');
        }

        socket.on('stateUpdate', (state) => {
            document.getElementById('timer').innerText = state.timer;
            document.getElementById('currentPlayer').innerText = state.currentPlayer || "In attesa...";
            document.getElementById('highestBidder').innerText = state.highestBidder || "-";
            document.getElementById('currentBid').innerText = state.currentBid;

            if (state.userCredits && myName in state.userCredits) {
                document.getElementById('myCredits').innerText = state.userCredits[myName];
            }

            const isBiddingActive = state.isTimerRunning && state.timer > 0;
            document.getElementById('bidBtn1').disabled = !isBiddingActive;
            document.getElementById('bidBtn5').disabled = !isBiddingActive;
            document.getElementById('bidBtn10').disabled = !isBiddingActive;
        });

        socket.on('auctionEnded', (data) => {
            if (data.winner !== "Nessuno") {
                alert(`🎉 GIOCATORE AGGIUDICATO!\n\n${data.player} a ${data.winner} per ${data.price} crediti!`);
            } else {
                alert(`❌ Asta terminata per ${data.player}: nessun offerente.`);
            }

            if (data.userCredits && myName in data.userCredits) {
                document.getElementById('myCredits').innerText = data.userCredits[myName];
            }
        });

        socket.on('errorMsg', (msg) => {
            alert(msg);
        });
    </script>
</body>
</html>
