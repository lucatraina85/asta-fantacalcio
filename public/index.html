<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Asta Fantacalcio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden; /* Evita lo scroll */
        }
        .container {
            width: 100%;
            max-width: 420px;
            height: 98vh;
            background: white;
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        h1 {
            font-size: 20px;
            color: #333;
        }
        .call-panel {
            background: #eef2f7;
            padding: 8px;
            border-radius: 8px;
            display: flex;
            gap: 5px;
            justify-content: center;
            align-items: center;
        }
        .call-panel input {
            flex: 1;
            padding: 8px;
            font-size: 14px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }
        .info-box {
            font-size: 16px;
            color: #444;
        }
        .player-title {
            font-size: 22px;
            font-weight: bold;
            color: #2c3e50;
            min-height: 28px;
        }
        .timer {
            font-size: 42px;
            font-weight: bold;
            color: #e74c3c;
            line-height: 1;
        }
        .dots-container {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin: 4px 0;
        }
        .dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background-color: #e74c3c;
            transition: background-color 0.3s;
        }
        .dot.green {
            background-color: #2ecc71;
        }
        button {
            padding: 10px;
            font-size: 14px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            color: white;
        }
        button:disabled {
            background-color: #bdc3c7 !important;
            cursor: not-allowed;
        }
        .btn-green { background-color: #2ecc71; }
        .btn-blue { background-color: #3498db; }
        .btn-orange { background-color: #f39c12; }
        .btn-red { background-color: #e74c3c; }

        .ready-btn {
            font-size: 16px;
            padding: 10px;
            width: 100%;
        }
        .bid-buttons {
            display: flex;
            gap: 8px;
            justify-content: space-between;
        }
        .bid-btn {
            flex: 1;
            font-size: 18px;
            padding: 14px 0;
            background-color: #2ecc71;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Asta Fantacalcio</h1>

        <div id="loginSection" style="margin: auto 0;">
            <p style="margin-bottom: 10px;">Inserisci il tuo nome per entrare:</p>
            <input type="text" id="userNameInput" placeholder="Il tuo nome" style="padding: 10px; font-size: 16px; width: 80%; margin-bottom: 10px; border-radius: 6px; border: 1px solid #ccc;">
            <br>
            <button class="btn-green" onclick="login()" style="width: 80%; font-size: 16px;">Entra</button>
        </div>

        <div id="auctionSection" style="display: none; height: 100%; flex-direction: column; justify-content: space-between;">
            <div>
                <p style="font-size: 12px; color: #666; margin-bottom: 4px;">Utente: <b id="displayName"></b></p>
                <div class="call-panel">
                    <input type="text" id="playerInput" placeholder="Nome Giocatore">
                    <button class="btn-blue" onclick="callPlayer()">Chiama</button>
                    <button class="btn-red" onclick="resetAuction()">X</button>
                </div>
            </div>

            <div class="player-title" id="currentPlayer">In attesa...</div>

            <div>
                <p style="font-size: 12px; margin-bottom: 2px;">Conferme Partecipanti:</p>
                <div class="dots-container" id="dotsContainer">
                    <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
                    <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
                </div>
                <button id="readyButton" class="ready-btn btn-orange" onclick="sendReady()" disabled>👍 SONO PRONTO!</button>
                <button class="btn-blue" onclick="forceStartAuction()" style="font-size: 10px; padding: 4px 8px; margin-top: 2px;">Forza Avvio</button>
            </div>

            <div class="timer" id="timer">5</div>

            <div class="info-box">
                Offerta: <b id="currentBid" style="font-size: 22px; color: #2c3e50;">0</b> cr |
                Offerente: <b id="highestBidder" style="color: #27ae60;">-</b>
            </div>

            <div class="bid-buttons">
                <button class="bid-btn" onclick="placeIncrementBid(1)" id="bidBtn1" disabled>+1</button>
                <button class="bid-btn" onclick="placeIncrementBid(5)" id="bidBtn5" disabled>+5</button>
                <button class="bid-btn" onclick="placeIncrementBid(10)" id="bidBtn10" disabled>+10</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myName = "";
        let isUserReady = false;

        function login() {
            const name = document.getElementById('userNameInput').value.trim();
            if (name) {
                myName = name;
                document.getElementById('displayName').innerText = myName;
                document.getElementById('loginSection').style.display = 'none';
                const auctionSec = document.getElementById('auctionSection');
                auctionSec.style.display = 'flex';
                socket.emit('registerUser', myName);
            }
        }

        function callPlayer() {
            const player = document.getElementById('playerInput').value.trim();
            if (player) {
                socket.emit('callPlayer', player);
                document.getElementById('playerInput').value = "";
            }
        }

        function forceStartAuction() {
            socket.emit('forceStartAuction');
        }

        function sendReady() {
            socket.emit('setUserReady');
            isUserReady = true;
            document.getElementById('readyButton').disabled = true;
        }

        function placeIncrementBid(increment) {
            socket.emit('placeIncrementBid', { userName: myName, increment: increment });
        }

        function resetAuction() {
            socket.emit('resetAuction');
        }

        socket.on('stateUpdate', (state) => {
            document.getElementById('timer').innerText = state.timer;
            document.getElementById('currentPlayer').innerText = state.currentPlayer || "In attesa...";
            document.getElementById('highestBidder').innerText = state.highestBidder || "-";
            document.getElementById('currentBid').innerText = state.currentBid;

            // Aggiorna pallini
            const dots = document.querySelectorAll('.dot');
            dots.forEach((dot, index) => {
                if (index < state.readyCount) {
                    dot.classList.add('green');
                } else {
                    dot.classList.remove('green');
                }
            });

            // Gestione pulsante PRONTO
            const readyBtn = document.getElementById('readyButton');
            if (state.currentPlayer !== "" && !state.isTimerRunning) {
                readyBtn.disabled = isUserReady;
            } else {
                readyBtn.disabled = true;
                if (state.currentPlayer === "") isUserReady = false;
            }

            // Attiva / Disattiva i 3 pulsanti di rilancio
            const isBiddingActive = state.isTimerRunning && state.timer > 0;
            document.getElementById('bidBtn1').disabled = !isBiddingActive;
            document.getElementById('bidBtn5').disabled = !isBiddingActive;
            document.getElementById('bidBtn10').disabled = !isBiddingActive;
        });

        socket.on('auctionEnded', (data) => {
            isUserReady = false;
            if (data.winner !== "Nessuno") {
                alert(`🎉 GIOCATORE AGGIUDICATO!\n\n${data.player} è stato acquistato da ${data.winner} per ${data.price} crediti!`);
            } else {
                alert(`❌ Asta terminata per ${data.player}: nessun offerente.`);
            }
        });
    </script>
</body>
</html>
